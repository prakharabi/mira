<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="holo-mark.css">
<style>
  /* The bar shown while Mira operates apps herself (computer control). It
     never takes focus and is kept out of screenshots; see ensureAgentPill in
     main.js.

     Same glass as the notch, and for the same reason: it floats over
     whatever app Mira is working in, and the see-through Liquid Glass
     variant let busy content behind it wash out its text. So: a mostly
     opaque dark surface with blur + saturation, a 0.5px specular highlight
     along the top edge, a hairline border and a soft float shadow. Buttons
     follow Quick Capture: the primary action is the accent gradient, the
     secondary a glass chip. */
  :root {
    --text-primary: rgba(255,255,255,0.92);
    --text-secondary: rgba(255,255,255,0.6);
    --glass-fill: rgba(255,255,255,0.08);
    --glass-fill-hover: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.16);
    --border: rgba(255,255,255,0.11);
    --ok: #30D158;
    --err: #FF453A;
    --warn: #FF9F0A;
    --accent-gradient: linear-gradient(135deg, #7d96ff 0%, #5b7cfa 50%, #4a8dff 100%);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    color: var(--text-primary);
  }

  #shell {
    box-sizing: border-box;
    height: 52px;
    margin: 6px;
    padding: 0 7px 0 12px;
    display: flex;
    align-items: center;
    gap: 11px;
    border-radius: 999px;
background: linear-gradient(180deg, rgba(60,66,92,0.50), rgba(22,24,34,0.62));
    backdrop-filter: blur(40px) saturate(200%);
    -webkit-backdrop-filter: blur(40px) saturate(200%);
    border: 1px solid rgba(255,255,255,0.20);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.32),
      inset 0 -1px 0 rgba(255,255,255,0.06),
      inset 0 0 18px rgba(169,191,255,0.07),
      0 12px 34px rgba(0,0,0,0.45),
      0 0 0 0.5px rgba(0,0,0,0.5);
    animation: rise 320ms var(--ease-back);
    transition: border-color 280ms var(--ease-out), box-shadow 280ms var(--ease-out);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.97); filter: blur(2px); } }
  /* Waiting on the user: an amber hairline, the only change in the surface. */
  #shell.confirm {
    border-color: color-mix(in srgb, var(--warn) 55%, transparent);
    box-shadow:
      inset 0 0.5px 0 rgba(255,255,255,0.1),
      0 0 0 3px color-mix(in srgb, var(--warn) 16%, transparent),
      0 10px 28px rgba(0,0,0,0.4);
  }

  /* Mira's own mark while she works; a state glyph once she's finished. */
  #mark { position: relative; width: 26px; height: 26px; flex-shrink: 0; }
  #mark .holo-mark { width: 26px; height: 26px; }
  #glyph {
    display: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    align-items: center;
    justify-content: center;
    box-shadow: inset 0 1px 0 var(--glass-highlight);
  }
  #glyph svg { width: 14px; height: 14px; }
  .done #glyph, .stopped #glyph, .stopping #glyph, .failed #glyph { display: flex; }
  .done .holo-mark, .stopped .holo-mark, .stopping .holo-mark, .failed .holo-mark { display: none; }
  .done #glyph { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .failed #glyph { background: color-mix(in srgb, var(--err) 22%, transparent); color: var(--err); }
  .stopped #glyph, .stopping #glyph { background: var(--glass-fill); color: var(--text-secondary); }
  .confirm .holo-mark { filter: saturate(0.4) sepia(0.6) hue-rotate(-10deg); }

  #body { flex: 1; min-width: 0; line-height: 1.3; }
  #title {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #text {
    font-size: 13px;
    font-weight: 590;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: opacity 200ms var(--ease-out);
  }
  kbd {
    font: inherit;
    padding: 0 4px;
    border-radius: 4px;
    background: var(--glass-fill);
  }

  button {
    font: inherit;
    font-size: 12.5px;
    font-weight: 650;
    height: 36px;
    padding: 0 16px;
    border-radius: 999px;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 160ms var(--ease-out), filter 160ms var(--ease-out), transform 120ms var(--ease-out);
  }
  button:active { transform: scale(0.96); }
  #stop {
    color: var(--err);
    background: var(--glass-fill);
    border: 1px solid var(--border);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
  }
  #stop:hover { background: color-mix(in srgb, var(--err) 16%, transparent); }
  #allow {
    display: none;
    color: #fff;
    border: none;
    background: var(--accent-gradient);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 3px 10px rgba(125,150,255,0.3);
  }
  #allow:hover { filter: brightness(1.1); }
  .confirm #allow { display: inline-block; }
  .done #stop, .stopped #stop, .failed #stop, .stopping #stop { display: none; }
</style>
</head>
<body>
  <div id="shell" class="running">
    <div id="mark">
      <span class="holo-mark"><span class="holo-halo"></span><span class="holo-lattice"></span><svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ag-mark" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#ag-mark)"/><circle cx="64" cy="30" r="6.5" fill="#fff"/><path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="holo-scan"></span></span>
      <div id="glyph"></div>
    </div>
    <div id="body">
      <div id="title"></div>
      <div id="text">Starting…</div>
    </div>
    <button id="allow">Allow</button>
    <button id="stop">Stop</button>
  </div>
<script>
  const { ipcRenderer } = require('electron');
  const shell = document.getElementById('shell');
  const GLYPHS = {
    done: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>',
    failed: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>',
    stopped: '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="4" y="4" width="8" height="8" rx="2"/></svg>',
  };
  GLYPHS.stopping = GLYPHS.stopped;
  const TITLES = {
    running: 'Mira is working · move the mouse or press <kbd>⌃Esc</kbd> to take over',
    confirm: 'Allow Mira to do this?',
    stopping: 'Stopping',
    done: 'Done',
    stopped: 'Stopped',
    failed: "Couldn't finish",
  };
  ipcRenderer.on('agent-status', (_e, { state = 'running', text = '', step = 0 }) => {
    shell.className = state;
    document.getElementById('glyph').innerHTML = GLYPHS[state] || '';
    document.getElementById('title').innerHTML =
      (TITLES[state] || state) + (state === 'running' && step ? ` · step ${step}` : '');
    const t = document.getElementById('text');
    t.textContent = text.charAt(0).toUpperCase() + text.slice(1);
    t.title = text;
  });
  document.getElementById('stop').onclick = () => ipcRenderer.send('agent-stop');
  document.getElementById('allow').onclick = () => ipcRenderer.send('agent-allow');
</script>
</body>
</html>
