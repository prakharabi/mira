<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; background:transparent; font-family:sans-serif; }
  #pill {
    display:inline-flex; gap:6px; background:#1e1e1e; padding:8px 14px;
    border-radius:20px; align-items:center; flex-wrap:nowrap;
    box-sizing:border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .word {
    color:white; font-size:13px; white-space:nowrap;
  }
  .word:not(:first-child) {
    color:rgba(255,255,255,0.5);
  }
  #hint {
    color:rgba(255,255,255,0.4); font-size:10px; margin-left:6px;
    border-left: 1px solid rgba(255,255,255,0.2); padding-left:6px;
  }
</style>
</head>
<body>
  <div id="pill">
    <span id="words"></span>
    <span id="hint">Tab</span>
  </div>
  <script>
    window.renderGhost = function(words) {
      const wordsEl = document.getElementById('words');
      wordsEl.innerHTML = words.map((w, i) =>
        '<span class="word">' + w + '</span>'
      ).join(' ');
    };
  </script>
</body>
</html>
