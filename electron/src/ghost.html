<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; background:transparent; font-family:sans-serif; }
  #pill {
    display:inline-flex; gap:6px; background:#1e1e1e; padding:8px 14px;
    border-radius:20px; align-items:center; flex-wrap:nowrap;
    box-sizing:border-box; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .word {
    color:white; font-size:13px; white-space:nowrap;
  }
  .word:not(:first-child) {
    color:rgba(255,255,255,0.5);
  }
  #hint {
    color:rgba(255,255,255,0.4); font-size:10px; margin-left:6px;
    border-left: 1px solid rgba(255,255,255,0.2); padding-left:6px;
  }

  /* in-word completion: the remaining letters of the word being typed */
  .suffix { color:#7c9fff; font-size:13px; white-space:nowrap; }

  /* correction mode: strikethrough wrong word -> correct word */
  .wrong { color:rgba(255,120,120,0.85); font-size:13px; text-decoration:line-through; white-space:nowrap; }
  .arrow { color:rgba(255,255,255,0.35); font-size:12px; }
  .correct { color:#7cffb0; font-size:13px; font-weight:600; white-space:nowrap; }
</style>
</head>
<body>
  <div id="pill">
    <span id="words"></span>
    <span id="hint">Tab</span>
  </div>
  <script>
    // payload shapes:
    //   { mode: 'next-word', words: ['foo', 'bar', ...] }   -- existing next-word suggestions
    //   { mode: 'in-word', suffix: 'ment' }                  -- letters completing the current word
    //   { mode: 'correction', wrong: 'teh', correct: 'the' } -- misspelling fix
    window.renderGhost = function(payload) {
      const wordsEl = document.getElementById('words');

      // backward-compatible: a bare array means the old next-word call shape
      if (Array.isArray(payload)) {
        payload = { mode: 'next-word', words: payload };
      }

      if (payload.mode === 'in-word') {
        wordsEl.innerHTML = '<span class="suffix">' + escapeHtml(payload.suffix) + '</span>';
      } else if (payload.mode === 'correction') {
        wordsEl.innerHTML =
          '<span class="wrong">' + escapeHtml(payload.wrong) + '</span>' +
          '<span class="arrow"> → </span>' +
          '<span class="correct">' + escapeHtml(payload.correct) + '</span>';
      } else {
        wordsEl.innerHTML = payload.words.map((w) =>
          '<span class="word">' + escapeHtml(w) + '</span>'
        ).join(' ');
      }
    };

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }
  </script>
</body>
</html>
