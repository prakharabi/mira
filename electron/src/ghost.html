<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    /* Chromium falls back to grayscale-only antialiasing on a transparent
       window without this, which on top of the text-shadow above compounded
       into text that looked soft rather than sharp. */
    -webkit-font-smoothing: antialiased;
  }

  /* One row, vertically centred, left-aligned at x=0. The window itself is
     transparent and click-through, so it can be wider than the text without
     any visual cost -- that avoids resizing (and re-flashing) the window on
     every keystroke. */
  #wrap {
    display: flex;
    align-items: center;
    height: 100vh;
    padding: 0;
    white-space: nowrap;
  }

  /* Inline suggestions sit directly on the target app's own background, whose
     colour is unknowable from here. A mid-grey reads acceptably on both light
     and dark surfaces, and the paired shadows keep it legible on either
     extreme rather than dissolving into one of them. */
  /* The previous version used two overlapping blurred text-shadows (2px and
     3px radius) to stay legible on both light and dark backgrounds -- but a
     blur radius that size doesn't read as a halo behind crisp text, it reads
     as the text itself being soft/out-of-focus, especially at the compact
     sizes this renders at. A single 1px, near-opaque shadow gives the same
     cross-background legibility as a hairline outline instead of a glow, so
     the glyphs themselves stay sharp. */
  .inline {
    color: #8b8b93;
    text-shadow: 0 0 1px rgba(0,0,0,0.7);
    letter-spacing: 0.1px;
  }
  .inline.next { font-style: italic; opacity: 0.92; }

  .tabhint {
    color: #8b8b93;
    opacity: 0.55;
    font-weight: 600;
    margin-left: 0.45em;
    text-shadow: 0 0 1px rgba(0,0,0,0.6);
  }

  /* Corrections are a distinct affordance rather than a continuation of the
     line, so they keep an explicit chip and sit below the text. */
  #chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(28,28,32,0.94);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 6px 11px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .wrong { color: #ff9a9a; text-decoration: line-through; }
  .arrow { color: rgba(255,255,255,0.35); }
  .correct { color: #7cffb0; font-weight: 600; }
  .chip-hint {
    color: rgba(255,255,255,0.4);
    border-left: 1px solid rgba(255,255,255,0.18);
    padding-left: 7px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div id="wrap"></div>
  <script>
    // payload shapes:
    //   { mode:'in-word',   suffix:'ment',            fontSize:13 }
    //   { mode:'next-word', words:['foo','bar'],      fontSize:13 }
    //   { mode:'correction', wrong:'teh', correct:'the', fontSize:13 }
    window.renderGhost = function (payload) {
      const wrap = document.getElementById('wrap');

      if (Array.isArray(payload)) payload = { mode: 'next-word', words: payload };

      const size = Math.max(10, Math.min(30, Number(payload.fontSize) || 13));
      wrap.style.fontSize = size + 'px';

      if (payload.mode === 'in-word') {
        // Only the letters that would complete the word, drawn immediately
        // after the caret so the word reads as already finished.
        wrap.innerHTML =
          '<span class="inline">' + esc(payload.suffix) + '</span>' +
          '<span class="tabhint">⇥</span>';

      } else if (payload.mode === 'correction') {
        wrap.innerHTML =
          '<span id="chip" style="font-size:' + Math.max(11, size - 1) + 'px">' +
            '<span class="wrong">' + esc(payload.wrong) + '</span>' +
            '<span class="arrow">→</span>' +
            '<span class="correct">' + esc(payload.correct) + '</span>' +
            '<span class="chip-hint">⇥</span>' +
          '</span>';

      } else {
        const words = payload.words || [];
        // Only the top prediction is drawn inline -- a list of alternatives
        // reads as a menu sitting in the sentence, which is exactly the
        // floating-label effect inline mode exists to avoid.
        wrap.innerHTML =
          '<span class="inline next">' + esc(words[0] || '') + '</span>' +
          '<span class="tabhint">⇥</span>';
      }
    };

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }
  </script>
</body>
</html>
