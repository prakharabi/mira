<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; background:transparent; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif; }
  #pet { width:100px; cursor:pointer; display:block; }
  #menu {
    display:none;
    position:absolute;
    bottom:110px;
    left:0;
    width:130px;
    background:linear-gradient(180deg, rgba(58,64,92,0.9), rgba(22,24,34,0.95));
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), 0 8px 22px rgba(0,0,0,0.4);
    backdrop-filter:blur(30px) saturate(190%);
    border-radius:14px;
    padding:6px;
    color:white;
    font-size:12px;
    box-sizing:border-box;
  }
  #menu div {
    padding:6px 8px;
    cursor:pointer;
    border-radius:6px;
    white-space:nowrap;
  }
  #menu div:hover { background:linear-gradient(135deg,#7d96ff,#5b7cfa); }
</style>
</head>
<body>
  <div id="menu">
    <div onclick="alert('Search clicked')">Search</div>
    <div onclick="alert('Summarize clicked')">Summarize</div>
    <div onclick="alert('Remind Me clicked')">Remind Me</div>
    <div onclick="alert('Translate clicked')">Translate to Hindi</div>
  </div>
  <img id="pet" src="pet.gif" onclick="openChat()">

  <script>
    const { ipcRenderer } = require('electron');

    function openChat() {
      ipcRenderer.send('open-chat');
    }

    // A logo chosen in Settings replaces the default sprite. Applied on load
    // and again whenever Settings changes it, so the pet updates without a
    // restart.
    const pet = document.getElementById('pet');
    function applyLogo(url) { pet.src = url || 'pet.gif'; }
    ipcRenderer.invoke('logo-get').then(applyLogo).catch(() => {});
    ipcRenderer.on('logo-changed', (event, url) => applyLogo(url));
  </script>
</body>
</html>
