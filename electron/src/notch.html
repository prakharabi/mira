<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="holo-mark.css">
<style>
  :root { color-scheme: light dark; }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Anchored top-center, right where a physical notch sits (or where one
     would be, on a Mac without one) -- the whole point is that it reads as
     an extension of the menu bar, not a floating popup that could be
     anywhere. It starts as a small pill and grows downward only, so it never
     shifts its own top edge as content changes. */
  #shell {
    /* NOT height:100% -- #shell must size to its own content (its natural
       height is what gets measured and sent to the main process to resize
       the WINDOW to match); giving it the window's own height instead would
       make that measurement circular and freeze the window at whatever size
       it last happened to be. */
    width: 100%;
    position: relative;
    /* Chrome-less by default -- truly not visible at rest, not just small.
       body.active is what draws the glass pill (background/border/shadow);
       without this split, a "resting" window was still a visible rounded
       rectangle sitting below the notch even with nothing in it. */
    background: transparent;
    border: 1px solid transparent;
    border-radius: 14px;
    overflow: hidden;
    color: rgba(255,255,255,0.92);
    box-sizing: border-box;
    transition: background 280ms cubic-bezier(0.22, 1, 0.36, 1),
                border-color 280ms cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 280ms cubic-bezier(0.22, 1, 0.36, 1),
                backdrop-filter 280ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* Styled like the macOS menu-bar menus rather than full liquid glass: the
     notch sits over whatever's on screen, and the more see-through glass
     version let busy content behind it wash out its own text. A mostly
     opaque dark surface with only a light blur keeps text crisp on any
     background while still reading as a system surface, not a flat box. */
  body.active #shell {
    background: rgba(30,30,32,0.9);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border-color: rgba(255,255,255,0.13);
    /* Rounded on every side, floating just clear of the menu bar rather than
       flush-mounted to it -- reads as a pill extending down from the notch,
       matching the reference, instead of a drawer welded to the bar. */
    box-shadow:
      inset 0 0.5px 0 rgba(255,255,255,0.1),
      0 10px 28px rgba(0,0,0,0.4),
      0 0 0 0.5px rgba(0,0,0,0.5);
  }

  /* Every state swap below cross-fades + rises slightly rather than
     hard-cutting between hidden/visible. A back-out curve (slight overshoot
     past the resting position before settling) reads as considerably more
     fluid than plain ease for the same distance -- this is the single
     change that does the most to make state swaps feel alive rather than
     mechanical. */
  #idle, #collapsed, #expanded, #listening, #speaking, #ask {
    transition: opacity 240ms cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 240ms cubic-bezier(0.34, 1.56, 0.64, 1),
                filter 240ms ease;
  }
  #idle[hidden], #collapsed[hidden], #expanded[hidden], #listening[hidden], #speaking[hidden], #ask[hidden] {
    display: flex; /* overridden below per-element, but keeps the transition running */
    opacity: 0;
    transform: translateY(-4px) scale(0.96);
    filter: blur(2px);
    pointer-events: none;
    position: absolute;
    inset: 0;
  }
  /* Hidden states stay rendered (opacity 0) so the fade above can run --
     which also left their infinite animations (holo mark, spinner, voice
     bars) ticking in a window that is always on screen. At rest that alone
     held this renderer at ~10% CPU, redrawing things nobody could see.
     Paused, they cost nothing and resume the moment a state is shown. */
  #idle[hidden] *, #collapsed[hidden] *, #expanded[hidden] *, #listening[hidden] *, #speaking[hidden] *, #ask[hidden] *,
  #idle[hidden] *::before, #collapsed[hidden] *::before, #expanded[hidden] *::before,
  #listening[hidden] *::before, #speaking[hidden] *::before, #ask[hidden] *::before,
  #idle[hidden] *::after, #collapsed[hidden] *::after, #expanded[hidden] *::after,
  #listening[hidden] *::after, #speaking[hidden] *::after, #ask[hidden] *::after {
    animation-play-state: paused !important;
  }

  /* At true rest this shows NOTHING -- no dash, no outline, nothing to see
     below the notch at all, matching a hardware notch's own edge exactly.
     Its only job while empty is to occupy the notch's real screen footprint
     as an invisible hover target. body.active reveals the hint. */
  #idle {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 1px;
    transition: height 280ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  body.active #idle { height: 40px; }
  #idle-hint {
    display: none;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.1px;
  }
  body.active #idle-hint { display: block; }
  #idle-hint kbd {
    font: inherit;
    background: rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 1px 5px;
    margin: 0 1px;
  }

  /* Mira's holographic mark -- the notch never had any brand mark before;
     one size fits every state it appears in here (idle hint, collapsed
     spinner row, listening/speaking/ask rows) since they're all the same
     34-40px-tall single line. */
  .holo-mark { width: 13px; height: 13px; }

  #collapsed {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    height: 34px;
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.9);
  }
  /* (fade handled by the shared #collapsed[hidden] rule above; this file
     only needed the layout override once, not a second conflicting one) */

  .spinner {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 1.6px solid rgba(255,255,255,0.22);
    border-top-color: #0A84FF;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Listening/speaking share one waveform layout -- only the bar color and
     each bar's own animation timing differ, so the two states read as
     clearly related (both "Mira's voice, active right now") rather than
     like unrelated features bolted on. Bars are plain CSS keyframes with
     staggered negative delays, not real audio amplitude -- there's no mic/
     speaker signal available in this renderer to drive them from, and a
     wandering pseudo-random bounce reads as "live" well enough without it
     (the same trick most voice-assistant UIs actually use). */
  #listening, #speaking {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 34px;
    padding: 0 14px;
  }
  .voice-bars {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 18px;
  }
  .voice-bars span {
    width: 3px;
    border-radius: 2px;
    animation: voicebar 900ms ease-in-out infinite;
  }
  #listening .voice-bars span { background: #0A84FF; }
  #speaking .voice-bars span { background: #30D158; }
  /* Seven bars, each a different phase/duration of the same keyframe so
     none of them are ever in lockstep -- a uniform pulse reads as a loading
     spinner, not speech. */
  .voice-bars span:nth-child(1) { height: 30%; animation-duration: 780ms; animation-delay: -310ms; }
  .voice-bars span:nth-child(2) { height: 55%; animation-duration: 900ms; animation-delay: -110ms; }
  .voice-bars span:nth-child(3) { height: 80%; animation-duration: 640ms; animation-delay: -560ms; }
  .voice-bars span:nth-child(4) { height: 100%; animation-duration: 1020ms; animation-delay: -20ms; }
  .voice-bars span:nth-child(5) { height: 75%; animation-duration: 700ms; animation-delay: -430ms; }
  .voice-bars span:nth-child(6) { height: 50%; animation-duration: 860ms; animation-delay: -240ms; }
  .voice-bars span:nth-child(7) { height: 32%; animation-duration: 950ms; animation-delay: -650ms; }
  @keyframes voicebar {
    0%, 100% { transform: scaleY(0.35); }
    50% { transform: scaleY(1); }
  }

  .voice-label-text {
    font-size: 11.5px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    white-space: nowrap;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* position:relative only so #close (position:absolute) has a positioning
     context while #expanded is actually shown -- must live here, NOT as an
     inline style on the element, because `#expanded[hidden]` above (higher
     specificity: id+attribute beats a bare id) is what's supposed to force
     position:absolute while hidden, keeping a hidden #expanded's full
     content height out of #shell's layout flow. An inline style used to sit
     directly on the element and always won regardless of specificity,
     which is exactly how #shell ended up measuring 113px of buttons/text
     nobody could see, even at rest. */
  #expanded { padding: 12px 14px 11px; position: relative; }

  #ask {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 10px 0 14px;
  }
  #ask-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    font: inherit;
    font-size: 12.5px;
    color: rgba(255,255,255,0.95);
    caret-color: #0A84FF;
  }
  #ask-input::placeholder { color: rgba(255,255,255,0.5); }

  /* Opened via Control+S, which is easy to trigger by mistake -- unlike
     #expanded (context/response), this state had no visible way out besides
     knowing to hit Escape. Same look as #close so both read as the same
     affordance. */
  /* #speak-close: the speaking pill's way to cut Mira off mid-sentence. */
  #ask-close, #speak-close {
    flex-shrink: 0;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    cursor: default;
    transition: background 140ms ease, color 140ms ease, transform 140ms ease;
  }
  #ask-close:hover, #speak-close:hover { background: rgba(255,69,58,0.26); color: #ff8078; }
  #ask-close:active, #speak-close:active { transform: scale(0.92); }
  #ask-close svg, #speak-close svg { width: 11px; height: 11px; }

  #context-text {
    font-size: 12px;
    line-height: 1.45;
    color: rgba(255,255,255,0.82);
    max-height: 4.4em;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    margin-bottom: 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  #actions { display: flex; gap: 6px; flex-wrap: wrap; }
  /* display:flex above beats the UA [hidden] rule, so without this the row
     never actually hid -- it sat under the Control+S answer and every
     working/response screen instead of only appearing for copied text. */
  #actions[hidden] { display: none; }
  #actions button {
    display: flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.08);
    border: 1px solid transparent;
    border-radius: 7px;
    padding: 6px 10px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 550;
    color: rgba(255,255,255,0.9);
    cursor: default;
    white-space: nowrap;
    transition: background 140ms ease, transform 140ms ease, border-color 140ms ease;
  }
  /* button { display:flex } beats the UA stylesheet's [hidden] {
     display:none }, so without this the Call button shows regardless of the
     attribute -- same bug already fixed once in pill.html, reintroduced here
     by not carrying it forward into this new file. */
  #actions button[hidden] { display: none; }
  /* Hover is the menu-item highlight: system blue, white text. */
  #actions button:hover { background: #0A64D6; color: #fff; }
  #actions button:hover svg { opacity: 1; }
  #actions button:active { transform: scale(0.97); background: #0957BD; }
  #actions svg { width: 12px; height: 12px; opacity: 0.85; }
  #call-btn { background: rgba(48,209,88,0.18); color: #b6f5c8; }
  #call-btn:hover { background: #248A3D; color: #fff; }

  #response-text {
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 260px;
    overflow-y: auto;
  }

  #foot {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,0.10);
  }
  .text-btn {
    background: none; border: none; cursor: default;
    color: rgba(255,255,255,0.7);
    font: inherit; font-size: 11px; font-weight: 600;
    padding: 3px 6px;
    margin: -3px -6px;
    border-radius: 6px;
    transition: background 140ms ease, color 140ms ease;
  }
  .text-btn:hover { color: rgba(255,255,255,0.95); background: rgba(255,255,255,0.08); }
  .text-btn.done { color: #30D158; }
  #foot .spacer { flex: 1; }
  #foot .hint { font-size: 10.5px; color: rgba(255,255,255,0.45); }

  #close {
    position: absolute;
    top: 8px; right: 8px;
    width: 20px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 7px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    cursor: default;
    transition: background 140ms ease, color 140ms ease, transform 140ms ease;
  }
  #close:hover { background: rgba(255,69,58,0.26); color: #ff8078; }
  #close:active { transform: scale(0.92); }
  #close svg { width: 11px; height: 11px; }

  @keyframes fadeInUp { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeInUp 160ms ease; }
</style>
</head>
<body>
  <div id="shell">
    <div id="idle">
      <span id="idle-hint"><kbd>⌃</kbd><kbd>S</kbd> to ask or do anything</span>
    </div>
    <div id="collapsed" hidden>
      <span class="holo-mark"><span class="holo-halo"></span><span class="holo-lattice"></span><svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ng-collapsed" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#ng-collapsed)"/><circle cx="64" cy="30" r="6.5" fill="#fff"/><path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="holo-scan"></span></span>
      <div class="spinner"></div><span id="collapsed-label">Reading…</span>
    </div>
    <div id="listening" hidden>
      <span class="holo-mark"><span class="holo-halo"></span><span class="holo-lattice"></span><svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ng-listening" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#ng-listening)"/><circle cx="64" cy="30" r="6.5" fill="#fff"/><path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="holo-scan"></span></span>
      <div class="voice-bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <span id="listening-label" class="voice-label-text">Listening…</span>
    </div>
    <div id="speaking" hidden>
      <span class="holo-mark"><span class="holo-halo"></span><span class="holo-lattice"></span><svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ng-speaking" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#ng-speaking)"/><circle cx="64" cy="30" r="6.5" fill="#fff"/><path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="holo-scan"></span></span>
      <div class="voice-bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <span id="voice-label" class="voice-label-text"></span>
      <button id="speak-close" title="Stop talking">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="ask" hidden>
      <span class="holo-mark"><span class="holo-halo"></span><span class="holo-lattice"></span><svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="ng-ask" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient></defs><rect width="128" height="128" rx="30" fill="url(#ng-ask)"/><circle cx="64" cy="30" r="6.5" fill="#fff"/><path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="holo-scan"></span></span>
      <input id="ask-input" type="text" placeholder="Ask Mira anything…" spellcheck="false">
      <button id="ask-close" title="Dismiss (esc)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="expanded" hidden>
      <button id="close" title="Dismiss (esc)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div id="context-text"></div>
      <div id="actions">
        <button data-action="open" title="Open in your default browser (links open directly, other text is searched)"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M3 10h14M10 3c2 2.2 2.9 4.6 2.9 7s-.9 4.8-2.9 7c-2-2.2-2.9-4.6-2.9-7S8 5.2 10 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Open in Browser</button>
        <button data-action="search"><svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Search</button>
        <button data-action="summarize"><svg viewBox="0 0 20 20" fill="none"><path d="M4 5.5h12M4 10h12M4 14.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Summarize</button>
        <button data-action="remind"><svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Remind</button>
        <button data-action="translate"><svg viewBox="0 0 20 20" fill="none"><path d="M3 5h7M6.5 5v1.5c0 3-1.5 5.5-3.5 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 9.5c1 2 2.6 3.2 4.5 3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11 17l3.2-8 3.3 8M12.3 14.5h4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Hindi</button>
        <button data-action="call" id="call-btn" hidden><svg viewBox="0 0 20 20" fill="none"><path d="M6.5 3.5l2 3-1.6 1.6a10 10 0 004.9 4.9L13.5 11l3 2-1 2.5c-.3.7-1 1.1-1.8 1C8.4 15.7 4.3 11.6 3.5 6.3c-.1-.8.3-1.5 1-1.8L6.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Call</button>
      </div>
      <div id="response" hidden>
        <div id="response-text" class="loading"></div>
        <div id="foot">
          <button class="text-btn" id="copy-btn">Copy</button>
          <button class="text-btn" id="back-btn">‹ Back</button>
          <span class="spacer"></span>
          <span class="hint">esc to close</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer, clipboard } = require('electron');
    const idleEl = document.getElementById('idle');
    const collapsedEl = document.getElementById('collapsed');
    const collapsedLabel = document.getElementById('collapsed-label');
    const expandedEl = document.getElementById('expanded');
    const contextEl = document.getElementById('context-text');
    const actionsEl = document.getElementById('actions');
    const responseEl = document.getElementById('response');
    const responseTextEl = document.getElementById('response-text');
    const callBtn = document.getElementById('call-btn');
    const listeningEl = document.getElementById('listening');
    const speakingEl = document.getElementById('speaking');
    const voiceLabelEl = document.getElementById('voice-label');
    const askEl = document.getElementById('ask');
    const askInputEl = document.getElementById('ask-input');
    const backBtn = document.getElementById('back-btn');
    const listeningLabelEl = document.getElementById('listening-label');

    let sourceText = '';
    let responseText = '';

    // Same pattern the pill uses -- Call only appears when there's actually
    // a number to call.
    const PHONE_RE = /(\+?\d[\d\s\-\(\)]{7,}\d)/;

    // "active" (visible dark pill, wide layout) is true whenever there's
    // something to show: hovering the idle target, or genuine content
    // (working/context/response) on screen. True bare rest -- not hovering,
    // nothing happening -- is the only time it's false, which is what makes
    // idle actually invisible instead of merely small.
    let hovering = false;
    let contentShown = false;
    function syncActive() {
      document.body.classList.toggle('active', hovering || contentShown);
    }

    // The old pill auto-dismissed itself 6s after appearing -- being a
    // disposable window created fresh per copy, that came for free. The
    // notch is a permanent fixture instead (see goIdle's comment below), so
    // nothing ever told it to let go of shown content on its own: it just
    // sat there expanded until someone hit Escape or the close button,
    // which read as "stuck" compared to the pill's own behavior. This
    // mirrors that auto-dismiss, paused for as long as the cursor is
    // actually over it so it never vanishes out from under an in-progress
    // read or click.
    let autoIdleTimer = null;
    function clearAutoIdle() {
      if (autoIdleTimer) { clearTimeout(autoIdleTimer); autoIdleTimer = null; }
    }
    function armAutoIdle(ms) {
      clearAutoIdle();
      autoIdleTimer = setTimeout(() => { if (!hovering) goIdle(); }, ms);
    }

    function reportSize() {
      // The window itself is resized from the main process to match content
      // height exactly, since this sits fixed at the top edge and must never
      // clip or leave dead transparent space below a rounded corner. `idle`
      // tells main.js which width to use too -- notch-matched and narrow at
      // rest, wide once there's real content or the hover hint to fit.
      ipcRenderer.send('notch-resize', {
        height: document.getElementById('shell').offsetHeight,
        idle: !contentShown && !hovering,
      });
    }

    // Runs permanently rather than being created per-trigger, so this is the
    // resting state most of the time -- nothing visible near the menu bar
    // until hovered or triggered, not a status display. Hovering it directly
    // IS hovering the notch, since the window only ever exists at that one
    // anchored spot.
    function goIdle() {
      clearAutoIdle();
      clearSpeakCaption();
      idleEl.hidden = false;
      collapsedEl.hidden = true;
      expandedEl.hidden = true;
      listeningEl.hidden = true;
      speakingEl.hidden = true;
      askEl.hidden = true;
      backBtn.hidden = false;  // restore default; ask-response hides it (see notch-ask-response below)
      contentShown = false;
      syncActive();
      requestAnimationFrame(reportSize);
    }

    // Listening/speaking are driven entirely from outside (main.js polls the
    // daemon's actual voice state -- see voice_state.py -- and sends these),
    // not on a timer like the copy/OCR states above: only the daemon knows
    // when a recording or afplay call has really finished, so there's
    // nothing sensible for armAutoIdle to guess at here. main.js sends
    // notch-idle itself the moment the daemon reports back to idle.
    ipcRenderer.on('notch-listening', () => {
      clearAutoIdle();
      clearSpeakCaption();
      idleEl.hidden = true;
      collapsedEl.hidden = true;
      expandedEl.hidden = true;
      speakingEl.hidden = true;
      askEl.hidden = true;
      listeningEl.hidden = false;
      listeningLabelEl.textContent = 'Listening…';
      contentShown = true;
      syncActive();
      requestAnimationFrame(reportSize);
    });

    // Live partial transcript from a SEPARATE capture main.js runs
    // specifically for this caption (see its startListeningCaption comment
    // for why) -- purely cosmetic, never what Mira actually acts on. Shows
    // only the last few words rather than the whole growing transcript:
    // this is a fixed-width pill, not a scrolling transcript view, and a
    // single-line ellipsis truncates from the END, which would hide the
    // newest word behind "…" right when it lands -- the opposite of what a
    // live caption should show.
    ipcRenderer.on('notch-listening-partial', (event, text) => {
      const words = (text || '').trim().split(/\s+/).filter(Boolean);
      listeningLabelEl.textContent = words.length ? words.slice(-8).join(' ') : 'Listening…';
      requestAnimationFrame(reportSize);
    });

    // A typed question, opened via Control+S -- takes real keyboard focus
    // (main.js uses w.show() rather than showInactive() for this one state
    // specifically) since every other notch trigger deliberately avoids
    // stealing focus, but there's nothing to type into otherwise.
    ipcRenderer.on('notch-ask', () => {
      clearAutoIdle();
      clearSpeakCaption();
      idleEl.hidden = true;
      collapsedEl.hidden = true;
      expandedEl.hidden = true;
      listeningEl.hidden = true;
      speakingEl.hidden = true;
      askEl.hidden = false;
      askInputEl.value = '';
      contentShown = true;
      syncActive();
      requestAnimationFrame(reportSize);
      // Focus after the resize/paint settles, not synchronously -- focusing
      // an element that's still mid-transition (opacity/blur still
      // animating in) can land the caret before the input is actually
      // interactive.
      setTimeout(() => askInputEl.focus(), 50);
    });

    askInputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && askInputEl.value.trim()) {
        ipcRenderer.send('notch-ask-submit', askInputEl.value.trim());
      }
      // Escape is handled by the existing document-level listener below
      // (sends notch-close), so nothing extra needed here for that.
    });

    // The daemon runs this through the full chat agent (tools, memory, the
    // works) via main.js's notch-ask-submit handler, so "what's on my
    // calendar today" or "remind me to..." works here too, not just plain
    // Q&A -- showNotchWorking('Thinking…') fires first (reusing the same
    // #collapsed spinner the OCR flow uses), then this replaces it with the
    // answer once the agent responds.
    ipcRenderer.on('notch-ask-response', (event, text) => {
      idleEl.hidden = true;
      collapsedEl.hidden = true;
      listeningEl.hidden = true;
      speakingEl.hidden = true;
      askEl.hidden = true;
      expandedEl.hidden = false;
      actionsEl.hidden = true;
      contextEl.hidden = true;
      responseEl.hidden = false;
      backBtn.hidden = true;  // nothing to go "back" to in this flow -- see goIdle for where this resets
      responseTextEl.classList.remove('loading');
      responseTextEl.textContent = text || "Didn't get an answer that time.";
      responseTextEl.classList.remove('fade-in'); void responseTextEl.offsetWidth; responseTextEl.classList.add('fade-in');
      contentShown = true;
      syncActive();
      armAutoIdle(12000);
      requestAnimationFrame(reportSize);
    });

    // Word-by-word caption reveal, timed to the ACTUAL audio duration
    // (measured daemon-side via afinfo on the synthesized file, not guessed
    // here) so a long reply and a short one both finish revealing right as
    // the audio does, the way a real-time caption should -- rather than a
    // fixed per-word delay that drifts out of sync either direction. Falls
    // back to an average-speech-rate estimate (~175 wpm) only when the
    // daemon couldn't measure a duration.
    let speakCaptionTimer = null;
    function clearSpeakCaption() {
      if (speakCaptionTimer) { clearInterval(speakCaptionTimer); speakCaptionTimer = null; }
    }
    function runSpeakCaption(text, duration) {
      clearSpeakCaption();
      const words = (text || '').split(/\s+/).filter(Boolean);
      if (!words.length) { voiceLabelEl.textContent = text || 'Speaking…'; return; }
      const totalMs = duration > 0 ? duration * 1000 : (words.length / 175) * 60000;
      const perWordMs = Math.max(40, totalMs / words.length);
      let shown = 0;
      voiceLabelEl.textContent = '';
      speakCaptionTimer = setInterval(() => {
        shown++;
        voiceLabelEl.textContent = words.slice(0, shown).join(' ');
        requestAnimationFrame(reportSize);  // caption grows the pill width as it fills
        if (shown >= words.length) clearSpeakCaption();
      }, perWordMs);
    }

    ipcRenderer.on('notch-speaking', (event, { text, duration }) => {
      clearAutoIdle();
      idleEl.hidden = true;
      collapsedEl.hidden = true;
      expandedEl.hidden = true;
      listeningEl.hidden = true;
      askEl.hidden = true;
      speakingEl.hidden = false;
      runSpeakCaption(text, duration);
      contentShown = true;
      syncActive();
      requestAnimationFrame(reportSize);
    });
    // Hover-to-reveal is switched off for now (not removed -- `hovering`
    // and every place that reads it below are left wired up on purpose).
    // To bring it back, re-add:
    //   document.body.addEventListener('mouseenter', () => {
    //     hovering = true; clearAutoIdle(); syncActive(); requestAnimationFrame(reportSize);
    //   });
    //   document.body.addEventListener('mouseleave', () => {
    //     hovering = false;
    //     if (contentShown) armAutoIdle(8000);  // resume the countdown fresh, not wherever it left off
    //     syncActive(); requestAnimationFrame(reportSize);
    //   });

    ipcRenderer.on('notch-idle', goIdle);

    ipcRenderer.on('notch-collapsed', (event, label, opts) => {
      clearSpeakCaption();
      idleEl.hidden = true;
      collapsedEl.hidden = false;
      expandedEl.hidden = true;
      listeningEl.hidden = true;
      speakingEl.hidden = true;
      askEl.hidden = true;  // reachable from notch-ask-submit's "Thinking…" step, not just OCR
      collapsedLabel.textContent = label || 'Reading…';
      contentShown = true;
      syncActive();
      // A stuck OCR call would otherwise leave this spinning forever; this
      // state normally transitions on its own (to context or an error) well
      // before this fires. "Thinking…" gets a far longer backstop -- a real
      // agent turn can legitimately take well over 15s, and its caller always
      // ends the state itself (see showNotchWorking in main.js).
      armAutoIdle(opts && opts.waitForAnswer ? 180000 : 15000);
      requestAnimationFrame(reportSize);
    });

    ipcRenderer.on('notch-context', (event, text) => {
      clearSpeakCaption();
      sourceText = text || '';
      idleEl.hidden = true;
      collapsedEl.hidden = true;
      listeningEl.hidden = true;
      speakingEl.hidden = true;
      askEl.hidden = true;
      expandedEl.hidden = false;
      contentShown = true;
      syncActive();
      responseEl.hidden = true;
      actionsEl.hidden = false;
      contextEl.hidden = false;
      contextEl.textContent = sourceText;
      backBtn.hidden = false;  // reset in case the last thing shown was an ask-response, which hides this
      callBtn.hidden = !PHONE_RE.test(sourceText);
      expandedEl.classList.remove('fade-in'); void expandedEl.offsetWidth; expandedEl.classList.add('fade-in');
      armAutoIdle(8000);
      requestAnimationFrame(reportSize);
    });

    function showWorking(label) {
      clearAutoIdle();  // an in-flight daemon call must never get cut off by this
      actionsEl.hidden = true;
      contextEl.hidden = true;
      responseEl.hidden = false;
      responseTextEl.classList.add('loading');
      responseTextEl.textContent = label || 'Working…';
      responseEl.classList.remove('fade-in'); void responseEl.offsetWidth; responseEl.classList.add('fade-in');
      requestAnimationFrame(reportSize);
    }

    actionsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      // Opening a page is instant and closes the notch -- no spinner to show.
      if (action === 'open') {
        ipcRenderer.send('notch-action', { action, text: sourceText });
        return;
      }
      showWorking(action === 'remind' ? 'Creating reminder…' : 'Working…');
      ipcRenderer.send('notch-action', { action, text: sourceText });
    });

    ipcRenderer.on('notch-response', (event, text) => {
      responseText = text || '';
      responseTextEl.classList.remove('loading');
      responseTextEl.textContent = responseText;
      responseTextEl.classList.remove('fade-in'); void responseTextEl.offsetWidth; responseTextEl.classList.add('fade-in');
      armAutoIdle(12000);  // longer than a bare context read -- there's an answer to actually read here
      requestAnimationFrame(reportSize);
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      responseEl.hidden = true;
      actionsEl.hidden = false;
      contextEl.hidden = false;
      armAutoIdle(8000);
      requestAnimationFrame(reportSize);
    });

    document.getElementById('copy-btn').addEventListener('click', (e) => {
      clipboard.writeText(responseText);
      const btn = e.currentTarget;
      btn.textContent = 'Copied';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1400);
    });

    document.getElementById('close').addEventListener('click', () => ipcRenderer.send('notch-close'));
    document.getElementById('ask-close').addEventListener('click', () => ipcRenderer.send('notch-close'));
    document.getElementById('speak-close').addEventListener('click', () => ipcRenderer.send('notch-stop-speaking'));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('notch-close');
    });

    // Report height once more after fonts/layout settle, in case the first
    // measurement raced the initial paint.
    window.addEventListener('load', () => setTimeout(reportSize, 30));
  </script>
</body>
</html>
