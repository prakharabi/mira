<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }

  html, body {
    margin: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* The window carries a macOS vibrancy material, so nothing here paints an
     opaque background -- doing so would cover the material entirely. */
  #bar {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 6px;
    height: 100%;
    box-sizing: border-box;
    animation: rise 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  button {
    display: flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 9px;
    padding: 7px 10px;
    font: inherit;
    font-size: 12px;
    font-weight: 550;
    color: var(--fg, rgba(255,255,255,0.92));
    cursor: default;
    white-space: nowrap;
    transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
  }
  /* The author `display: flex` above beats the UA stylesheet's
     `[hidden] { display: none }`, so without this the Call button would show
     on every copy regardless of the attribute. */
  button[hidden] { display: none; }
  button:hover { background: rgba(127,127,127,0.20); border-color: rgba(127,127,127,0.14); }
  button:active { transform: scale(0.96); }
  button svg { width: 13px; height: 13px; opacity: 0.78; }

  .sep {
    width: 1px;
    height: 18px;
    background: rgba(127,127,127,0.3);
    margin: 0 3px;
    flex-shrink: 0;
  }

  /* The pill had no way to dismiss it except waiting for the timeout, which is
     the main thing that made it feel like it was stuck on screen. */
  #close {
    padding: 7px 9px;
    color: rgba(127,127,127,0.9);
  }
  #close:hover { background: rgba(240,68,56,0.18); color: #ff6369; }
  #close svg { width: 11px; height: 11px; opacity: 1; }

  @media (prefers-color-scheme: light) {
    button { color: rgba(0,0,0,0.85); }
  }
</style>
</head>
<body>
  <div id="bar">
    <button data-action="search" title="Search this">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Search
    </button>
    <button data-action="summarize" title="Summarize this">
      <svg viewBox="0 0 20 20" fill="none"><path d="M4 5.5h12M4 10h12M4 14.5h7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Summarize
    </button>
    <button data-action="remind" title="Create a reminder">
      <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.5" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Remind
    </button>
    <button data-action="translate" title="Translate to Hindi">
      <svg viewBox="0 0 20 20" fill="none"><path d="M3 5h7M6.5 5v1.5c0 3-1.5 5.5-3.5 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M5 9.5c1 2 2.6 3.2 4.5 3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M11 17l3.2-8 3.3 8M12.3 14.5h4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Hindi
    </button>
    <button data-action="call" id="call-btn" hidden title="Call this number">
      <svg viewBox="0 0 20 20" fill="none"><path d="M6.5 3.5l2 3-1.6 1.6a10 10 0 004.9 4.9L13.5 11l3 2-1 2.5c-.3.7-1 1.1-1.8 1C8.4 15.7 4.3 11.6 3.5 6.3c-.1-.8.3-1.5 1-1.8L6.5 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      Call
    </button>
    <div class="sep"></div>
    <button id="close" title="Dismiss (esc)">
      <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    window.selectedText = '';

    // Same pattern main.js uses to pull a number out of the text -- kept in
    // step with extractPhoneNumber() there. Call only appears when there is
    // actually something to call; a permanently visible Call button that
    // answers "No phone number found" is worse than no button.
    const PHONE_RE = /(\+?\d[\d\s\-\(\)]{7,}\d)/;

    ipcRenderer.on('selected-text', (event, text) => {
      window.selectedText = text;
      document.getElementById('call-btn').hidden = !PHONE_RE.test(text || '');
    });

    document.querySelectorAll('button[data-action]').forEach((btn) => {
      btn.addEventListener('click', () => {
        ipcRenderer.send('pill-action', { action: btn.dataset.action, text: window.selectedText });
        ipcRenderer.send('close-pill');
      });
    });

    document.getElementById('close').addEventListener('click', () => {
      ipcRenderer.send('close-pill');
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('close-pill');
    });
  </script>
</body>
</html>
