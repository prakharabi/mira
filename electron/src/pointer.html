<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Full-display, transparent, click-through overlay (see showPointer in
     main.js). Draws either a ring around what Mira is pointing at, or a
     brief edge glow when she takes a screenshot. The ring is Mira's accent
     gradient; the label chip is the notch's glass (dark, blurred, with a
     specular top edge) so it stays legible over any app. */
  :root {
    --accent-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 45%, #06b6d4 100%);
    --ease-back: cubic-bezier(0.34, 1.56, 0.64, 1);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #flash {
    position: fixed;
    inset: 0;
    border-radius: 12px;
    box-shadow: inset 0 0 0 3px rgba(139, 92, 246, 0.85), inset 0 0 36px rgba(6, 182, 212, 0.45);
    opacity: 0;
    pointer-events: none;
  }
  #flash.on { animation: flash 0.9s ease-out forwards; }
  @keyframes flash {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  #ring, #ripple {
    position: fixed;
    border-radius: 12px;
    pointer-events: none;
    display: none;
  }
  /* Hollow: the target has to stay visible through the ring. The gradient
     stroke is a masked pseudo-element (a transparent fill over a gradient
     background still shows the gradient everywhere); the glow is an outer
     box-shadow, which is never drawn inside the box. */
  #ring { box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18), 0 0 28px rgba(6, 182, 212, 0.55); }
  #ring::before {
    content: '';
    position: absolute;
    inset: 0;
    padding: 3px;
    border-radius: inherit;
    background: var(--accent-gradient);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
  }
  #ring.on { display: block; animation: pop 0.4s var(--ease-back), pulse 1.4s ease-in-out 0.4s 3; }
  #ripple { border: 2px solid rgba(139, 92, 246, 0.7); }
  #ripple.on { display: block; animation: ripple 1.4s ease-out 0.1s 3; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pulse { 50% { transform: scale(1.05); } }
  @keyframes ripple { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.5); opacity: 0; } }

  /* For targets in the menu bar, which this window can't cover. */
  #arrow {
    position: fixed;
    top: 4px;
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-bottom: 22px solid #6366f1;
    filter: drop-shadow(0 0 8px rgba(6, 182, 212, 0.8));
    display: none;
  }
  #arrow.on { display: block; animation: bob 0.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  #label {
    position: fixed;
    max-width: 320px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(30,30,32,0.9);
    backdrop-filter: blur(24px) saturate(140%);
    -webkit-backdrop-filter: blur(24px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.13);
    box-shadow:
      inset 0 0.5px 0 rgba(255,255,255,0.1),
      0 10px 28px rgba(0,0,0,0.4),
      0 0 0 0.5px rgba(0,0,0,0.5);
    color: rgba(255,255,255,0.92);
    font-size: 12.5px;
    font-weight: 650;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }
  #label.on { display: block; animation: fadein 320ms var(--ease-back); }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px) scale(0.96); filter: blur(2px); } }

  body.leaving #ring, body.leaving #ripple, body.leaving #label, body.leaving #arrow {
    transition: opacity 0.5s ease-in;
    opacity: 0;
  }
</style>
</head>
<body>
  <div id="flash"></div>
  <div id="ripple"></div>
  <div id="ring"></div>
  <div id="arrow"></div>
  <div id="label"></div>
<script>
  const { ipcRenderer } = require('electron');
  const $ = (id) => document.getElementById(id);
  let leaveTimer = null;

  function reset() {
    clearTimeout(leaveTimer);
    document.body.classList.remove('leaving');
    for (const id of ['ring', 'ripple', 'arrow', 'label', 'flash']) $(id).classList.remove('on');
    // Force a reflow so re-adding .on restarts the animations.
    void document.body.offsetWidth;
  }

  function place(el, left, top, width, height) {
    Object.assign(el.style, { left: `${left}px`, top: `${top}px`,
      width: width == null ? '' : `${width}px`, height: height == null ? '' : `${height}px` });
  }

  ipcRenderer.on('pointer-flash', () => {
    reset();
    $('flash').classList.add('on');
  });

  ipcRenderer.on('pointer-show', (_e, p) => {
    reset();
    const W = window.innerWidth, H = window.innerHeight;
    // Global screen points -> this window's own coordinates.
    const left = p.x - p.originX, top = p.y - p.originY;
    const width = Math.max(24, p.w), height = Math.max(20, p.h);
    const label = $('label');
    label.textContent = p.label || '';

    if (top + height <= 0) {
      // Target is in the menu bar above this window: point up at it.
      const cx = Math.min(W - 20, Math.max(20, left + width / 2));
      place($('arrow'), cx - 14, 4);
      $('arrow').classList.add('on');
      if (p.label) {
        label.classList.add('on');
        const lw = label.offsetWidth;
        place(label, Math.min(W - lw - 8, Math.max(8, cx - lw / 2)), 32);
      }
    } else {
      for (const id of ['ring', 'ripple']) {
        place($(id), left, top, width, height);
        $(id).classList.add('on');
      }
      if (p.label) {
        label.classList.add('on');
        const lw = label.offsetWidth, lh = label.offsetHeight;
        const lx = Math.min(W - lw - 8, Math.max(8, left + width / 2 - lw / 2));
        // Below the target unless that runs off the bottom.
        const ly = top + height + 12 + lh < H ? top + height + 12 : Math.max(8, top - lh - 12);
        place(label, lx, ly);
      }
    }
    leaveTimer = setTimeout(() => document.body.classList.add('leaving'), Math.max(1, (p.seconds || 7) - 0.5) * 1000);
  });
</script>
</body>
</html>
