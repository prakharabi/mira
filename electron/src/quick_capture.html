<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --text-primary: rgba(0,0,0,0.87);
    --text-tertiary: rgba(0,0,0,0.38);
    --hairline: rgba(0,0,0,0.10);
    --accent: #6366f1;
    --ok: #30a46c;
    --err: #e5484d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text-primary: rgba(255,255,255,0.92);
      --text-tertiary: rgba(255,255,255,0.38);
      --hairline: rgba(255,255,255,0.10);
      --ok: #3dd68c;
      --err: #ff6369;
    }
  }

  html, body {
    margin: 0; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--text-primary);
  }

  /* The window itself carries a macOS vibrancy material, so nothing here paints
     an opaque background -- it would cover the material. */
  #panel {
    height: 100%;
    display: flex;
    flex-direction: column;
    -webkit-app-region: drag;
  }

  #head {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 16px 9px;
    flex-shrink: 0;
  }
  #head .mark { width: 15px; height: 15px; opacity: 0.9; }
  #head .title { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; }
  #head .spacer { flex: 1; }
  #head .hint { font-size: 11px; color: var(--text-tertiary); }

  #input {
    -webkit-app-region: no-drag;
    flex: 1;
    margin: 0 12px;
    padding: 8px 8px 10px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-primary);
  }
  #input::placeholder { color: var(--text-tertiary); }

  #foot {
    flex-shrink: 0;
    border-top: 1px solid var(--hairline);
    padding: 8px 16px 10px;
    display: flex; align-items: center; gap: 10px;
    font-size: 11px;
    color: var(--text-tertiary);
  }
  #foot .spacer { flex: 1; }
  kbd {
    font-family: inherit;
    font-size: 10.5px;
    padding: 1.5px 5px;
    border-radius: 4px;
    border: 1px solid var(--hairline);
    color: var(--text-tertiary);
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }

  #mic {
    -webkit-app-region: no-drag;
    display: inline-flex; align-items: center; gap: 5px;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 3px 9px;
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-tertiary);
    cursor: default;
    flex-shrink: 0;
    transition: color 120ms, border-color 120ms, background 120ms;
  }
  #mic svg { width: 12px; height: 12px; }
  #mic:hover { color: var(--text-primary); }
  #mic:disabled { opacity: 0.5; }
  #mic.recording {
    color: var(--err);
    border-color: color-mix(in srgb, var(--err) 45%, transparent);
    background: color-mix(in srgb, var(--err) 14%, transparent);
    animation: mic-pulse 1.4s ease-in-out infinite;
  }
  @keyframes mic-pulse { 50% { opacity: 0.6; } }

  .spin {
    display: inline-block; width: 10px; height: 10px;
    border: 1.6px solid var(--hairline);
    border-top-color: var(--text-primary);
    border-radius: 50%;
    animation: spin 700ms linear infinite;
    vertical-align: -1px; margin-right: 5px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="panel">
    <div id="head">
      <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="qc-g" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <rect width="128" height="128" rx="30" fill="url(#qc-g)"/>
        <circle cx="64" cy="30" r="6.5" fill="#fff"/>
        <path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="title">Quick Capture</div>
      <div class="spacer"></div>
      <div class="hint">Dump Box</div>
    </div>

    <textarea id="input" placeholder="Anything on your mind…" spellcheck="false"></textarea>

    <div id="foot">
      <span id="status"><kbd>↩</kbd> save &amp; process &nbsp; <kbd>⇧↩</kbd> new line &nbsp; <kbd>esc</kbd> close</span>
      <span class="spacer"></span>
      <button id="mic" title="Dictate (⌘D)">
        <svg viewBox="0 0 20 20" fill="none">
          <rect x="7.5" y="2.5" width="5" height="9" rx="2.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M5 9.5a5 5 0 0 0 10 0M10 14.5V17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span id="mic-label">Dictate</span>
      </button>
    </div>
  </div>

<script>
  const { ipcRenderer } = require('electron');
  const DAEMON_URL = 'http://localhost:11200';

  const input = document.getElementById('input');
  const status = document.getElementById('status');
  let busy = false;

  function setStatus(html, cls) {
    status.className = cls || '';
    status.innerHTML = html;
  }

  const IDLE_STATUS =
    '<kbd>↩</kbd> save &amp; process &nbsp; <kbd>⇧↩</kbd> new line &nbsp; <kbd>esc</kbd> close';

  // The window is reused across invocations, so every open starts clean rather
  // than showing whatever the last capture left behind.
  ipcRenderer.on('quick-capture-reset', () => {
    busy = false;
    if (typeof dictation !== 'undefined') dictation.stop();
    input.value = '';
    input.disabled = false;
    setStatus(IDLE_STATUS);
    input.focus();
  });

  async function capture() {
    const text = input.value.trim();
    if (!text || busy) return;

    busy = true;
    input.disabled = true;
    setStatus('<span class="spin"></span>Saving…');

    try {
      const entry = await (await fetch(`${DAEMON_URL}/dumpbox`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      })).json();

      if (entry.error) throw new Error(entry.error);

      // The capture is already safely stored at this point. Processing runs
      // after the window closes so the user isn't held waiting on a model call
      // for something that's already saved.
      setStatus('Saved', 'ok');
      ipcRenderer.send('quick-capture-done', entry.id);
    } catch (e) {
      busy = false;
      input.disabled = false;
      setStatus('Could not reach Mira daemon — nothing was saved.', 'err');
      input.focus();
    }
  }

  // ---------- dictation ----------
  const { createDictation } = require('./dictation');
  const micBtn = document.getElementById('mic');
  const micLabel = document.getElementById('mic-label');

  const dictation = createDictation({
    onText: (text) => {
      input.value = input.value ? `${input.value.replace(/\s+$/, '')} ${text}` : text;
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    },
    onStateChange: (state) => {
      // The panel dismisses itself on focus loss; while the mic is live that
      // would leave a recording running behind an invisible window.
      ipcRenderer.send('quick-capture-busy', state !== 'idle');
      micBtn.classList.toggle('recording', state === 'recording');
      micBtn.disabled = state === 'transcribing';
      micLabel.textContent =
        state === 'recording' ? 'Stop' :
        state === 'transcribing' ? 'Transcribing…' : 'Dictate';
      if (state === 'recording') setStatus('Listening… <kbd>⌘D</kbd> or click Stop when done');
      else if (state === 'transcribing') setStatus('<span class="spin"></span>Transcribing…');
      else setStatus(IDLE_STATUS);
    },
    onError: (msg) => setStatus(msg, 'err'),
  });

  micBtn.onclick = () => dictation.toggle();

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      dictation.stop();
      ipcRenderer.send('quick-capture-close');
      return;
    }
    // ⌘D toggles dictation without leaving the keyboard, which is the whole
    // point of a panel you open with a shortcut.
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'd') {
      e.preventDefault();
      dictation.toggle();
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      // Stop first so anything still being spoken makes it into the capture.
      if (dictation.isRecording()) { dictation.stop(); return; }
      capture();
    }
  });

  input.focus();
</script>
</body>
</html>
