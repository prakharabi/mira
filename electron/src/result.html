<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --fg: rgba(255,255,255,0.92);
    --fg-dim: rgba(255,255,255,0.5);
    --hairline: rgba(255,255,255,0.12);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --fg: rgba(0,0,0,0.87);
      --fg-dim: rgba(0,0,0,0.5);
      --hairline: rgba(0,0,0,0.12);
    }
  }

  html, body {
    margin: 0; height: 100%;
    background: transparent;   /* window vibrancy shows through */
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* Grid, not a fixed-height flex column: the previous layout gave the body a
     hard 180px height with padding, so the close button was pushed outside the
     window and the result really could get stuck on screen with no way out. */
  #shell {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100%;
    animation: rise 160ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(5px) scale(0.98); }
    to   { opacity: 1; transform: none; }
  }

  #head {
    display: flex; align-items: center; gap: 7px;
    padding: 9px 10px 7px 13px;
    -webkit-app-region: drag;   /* let the user move it out of the way */
  }
  #head .mark { width: 13px; height: 13px; flex-shrink: 0; }
  #head .title { font-size: 11.5px; font-weight: 650; letter-spacing: -0.01em; }
  #head .spacer { flex: 1; }

  .icon-btn {
    -webkit-app-region: no-drag;
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px;
    border: none; border-radius: 6px;
    background: transparent;
    color: var(--fg-dim);
    cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .icon-btn svg { width: 12px; height: 12px; }
  .icon-btn:hover { background: rgba(127,127,127,0.22); color: var(--fg); }
  #close:hover { background: rgba(240,68,56,0.18); color: #ff6369; }

  #content {
    padding: 0 14px;
    font-size: 13px;
    line-height: 1.55;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;          /* the text is the point -- let it be selected */
  }
  #content.loading { color: var(--fg-dim); font-style: italic; }

  #foot {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--hairline);
    font-size: 11px;
    color: var(--fg-dim);
  }
  #foot .spacer { flex: 1; }

  .text-btn {
    -webkit-app-region: no-drag;
    background: transparent;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 4px 9px;
    font: inherit; font-size: 11px; font-weight: 600;
    color: var(--fg-dim);
    cursor: default;
    transition: background 120ms ease, color 120ms ease;
  }
  .text-btn:hover { background: rgba(127,127,127,0.18); color: var(--fg); }
  .text-btn.done { color: #3dd68c; border-color: rgba(61,214,140,0.4); }

  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-thumb { background: rgba(127,127,127,0.35); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="shell">
    <div id="head">
      <svg class="mark" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/>
        </linearGradient></defs>
        <rect width="128" height="128" rx="30" fill="url(#rg)"/>
        <circle cx="64" cy="30" r="6.5" fill="#fff"/>
        <path d="M36 90 V46 L64 76 L92 46 V90" fill="none" stroke="#fff" stroke-width="11"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="title">Mira</div>
      <div class="spacer"></div>
      <button class="icon-btn" id="close" title="Close (esc)">
        <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="content" class="loading">Working…</div>

    <div id="foot">
      <button class="text-btn" id="copy">Copy</button>
      <span class="spacer"></span>
      <span>esc to close</span>
    </div>
  </div>

  <script>
    const { ipcRenderer, clipboard } = require('electron');
    const contentEl = document.getElementById('content');
    let resultText = '';

    ipcRenderer.on('result-text', (event, text) => {
      resultText = text || '';
      contentEl.classList.remove('loading');
      contentEl.textContent = resultText;
    });

    document.getElementById('close').addEventListener('click', () => {
      ipcRenderer.send('close-result');
    });

    // The whole reason to show generated text is to reuse it, so copying it
    // shouldn't require selecting it by hand first.
    document.getElementById('copy').addEventListener('click', (e) => {
      const selection = window.getSelection().toString();
      clipboard.writeText(selection || resultText);
      const btn = e.currentTarget;
      btn.textContent = selection ? 'Selection copied' : 'Copied';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('done'); }, 1400);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') ipcRenderer.send('close-result');
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'c' && !window.getSelection().toString()) {
        clipboard.writeText(resultText);
      }
    });
  </script>
</body>
</html>
